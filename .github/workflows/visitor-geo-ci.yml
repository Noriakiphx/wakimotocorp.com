name: Visitor Geo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - name: Validate installer and privacy invariants
        run: bash VisitorGeoInstaller/test.sh
      - name: Check Edge Function formatting
        run: >-
          deno fmt --check
          supabase/functions/analytics-ingest/index.ts
          supabase/functions/analytics-ingest/upsert.ts
          supabase/functions/analytics-ingest/validation.ts
          supabase/functions/analytics-ingest/validation_test.ts
          supabase/functions/visitor-dashboard/index.ts
          wakimotocorp-site/netlify/edge-functions/analytics-ingest-proxy.ts
      - name: Lint Edge Functions
        run: >-
          deno lint
          supabase/functions/analytics-ingest/index.ts
          supabase/functions/analytics-ingest/upsert.ts
          supabase/functions/analytics-ingest/validation.ts
          supabase/functions/analytics-ingest/validation_test.ts
          supabase/functions/visitor-dashboard/index.ts
          wakimotocorp-site/netlify/edge-functions/analytics-ingest-proxy.ts
      - name: Test analytics validation
        run: deno test supabase/functions/analytics-ingest/validation_test.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start
      - name: Run database tests
        run: npx supabase test db
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
