<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ページが見つかりません | WAKIMOTO CORP</title>
  <meta name="description" content="お探しのページは見つかりませんでした。WAKIMOTO CORP公式サイトのトップページへお戻りください。">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b0d10">
  <style>
    :root { color-scheme: dark; --bg:#090b0e; --ink:#f7f8f7; --muted:#aab2b8; --line:rgba(255,255,255,.13); --accent:#ff3b2f; --radius:8px; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:28px; background:linear-gradient(120deg, #090b0e, #180c0c); color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.75; text-align:center; }
    main { width:min(100%, 620px); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(30px, 7vw, 58px); background:rgba(16,21,27,.86); }
    .code { color:var(--accent); font-size:clamp(4rem, 19vw, 9rem); line-height:.9; font-weight:900; }
    h1 { margin:18px 0 0; font-size:clamp(1.7rem, 6vw, 3rem); line-height:1.15; letter-spacing:0; }
    p { margin:18px auto 30px; color:var(--muted); max-width:34rem; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:12px 20px; border-radius:var(--radius); background:var(--ink); color:#050608; text-decoration:none; font-weight:800; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>ページが見つかりません</h1>
    <p>URLが変更されたか、ページが削除された可能性があります。</p>
    <a href="/">トップへ戻る</a>
  </main>
</body>
</html>
