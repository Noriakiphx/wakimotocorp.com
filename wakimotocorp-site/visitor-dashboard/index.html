<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Visitor Geo Intelligence</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111f;color:#edf5ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#183b61,transparent 38rem),#08111f}
    main{width:min(1320px,calc(100% - 32px));margin:0 auto;padding:32px 0 64px}
    h1{margin:0 0 6px}.muted,small{color:#9bb0c8}.panel,article{background:#101e31;border:1px solid #29425f;border-radius:14px;padding:18px}
    #gate{max-width:440px;margin:12vh auto}form{display:grid;gap:12px}input,select,button{padding:12px;border:1px solid #35516f;border-radius:8px;background:#162b44;color:inherit}
    button{cursor:pointer;background:#1769aa;font-weight:700}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.cards article{display:grid;gap:8px}.cards strong{font-size:1.7rem}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.wide{grid-column:1/-1}
    ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #29425f}
    .table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #29425f;white-space:nowrap}
    @media(max-width:850px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <section id="gate" class="panel">
      <h1>Visitor Geo Intelligence</h1>
      <p class="muted">管理トークンはこのブラウザのセッション内だけに保存されます。</p>
      <form id="login">
        <input id="token" type="password" autocomplete="current-password"
          required placeholder="Dashboard token">
        <button>開く</button>
      </form>
    </section>
    <section id="dashboard" hidden>
      <h1>Visitor Geo Intelligence</h1>
      <p id="status" class="muted"></p>
      <div class="toolbar">
        <select id="days">
          <option value="1">24時間</option><option value="7">7日</option>
          <option value="30" selected>30日</option><option value="90">90日</option>
        </select>
        <button id="refresh">更新</button>
      </div>
      <section id="summary" class="cards"></section>
      <section class="grid">
        <article><h2>上位ページ</h2><ul id="pages"></ul></article>
        <article><h2>流入元</h2><ul id="referrers"></ul></article>
        <article><h2>地域</h2><ul id="locations"></ul></article>
        <article class="wide">
          <h2>高スコア訪問者</h2>
          <div class="table">
            <table>
              <thead><tr><th>Score</th><th>最終訪問</th><th>地域</th><th>端末</th><th>訪問数</th></tr></thead>
              <tbody id="visitors"></tbody>
            </table>
          </div>
        </article>
      </section>
    </section>
  </main>
  <script src="/assets/js/visitor-dashboard.js"></script>
</body>
</html>
