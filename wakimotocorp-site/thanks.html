  <style>
    :root { color-scheme: dark; --bg:#090b0e; --ink:#f7f8f7; --muted:#aab2b8; --line:rgba(255,255,255,.13); --accent:#28d7c8; --radius:8px; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:28px; background:radial-gradient(circle at 80% 15%, rgba(40,215,200,.16), transparent 32%), var(--bg); color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.75; text-align:center; }
    main { width:min(100%, 620px); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(30px, 7vw, 58px); background:rgba(16,21,27,.86); }
    h1 { margin:0; font-size:clamp(2rem, 7vw, 3.8rem); line-height:1.08; letter-spacing:0; }
    p { margin:18px auto 30px; color:var(--muted); max-width:34rem; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:12px 20px; border-radius:var(--radius); background:var(--accent); color:#050608; text-decoration:none; font-weight:800; }
    a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  </style>
</head>
